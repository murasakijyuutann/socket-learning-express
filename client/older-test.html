<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebSocket Test Client</title>
<style>
    body { font-family: monospace; max-width: 600px; margin: 40px auto; }
    label { display: block; margin-top: 10px; }
    input { padding: 4px; }
    button { padding: 6px 12px; margin-top: 8px; margin-right: 8px; }
    #log {
        margin-top: 20px;
        border: 1px solid #ccc;
        padding: 10px;
        height: 300px;
        overflow-y: auto;
        background: #111;
        color: #0f0;
        font-size: 13px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<h2>Raw WebSocket Test Client</h2>

<label>
    Username:
    <input id="username" type="text" placeholder="e.g. alice">
</label>
<label>
    Room ID:
    <input id="roomId" type="text" placeholder="e.g. room1">
</label>

<div>
    <button id="connectBtn">Connect</button>
    <button id="joinBtn" disabled>Join Room</button>
</div>

<div id="log"></div>

<script>
    const logEl = document.getElementById('log');
    const usernameInput = document.getElementById('username');
    const roomIdInput = document.getElementById('roomId');
    const connectBtn = document.getElementById('connectBtn');
    const joinBtn = document.getElementById('joinBtn');

    let socket = null;

    function log(message) {
        const line = document.createElement('div');
        line.textContent = message;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
    }

    connectBtn.addEventListener('click', () => {
        const username = usernameInput.value.trim();
        if (!username) {
            log('enter a username first');
            return;
        }

        // No socket.handshake.auth on the client side either - the raw
        // WebSocket constructor has no options object for headers/auth,
        // so the token has to travel as a query string param, same as
        // the CLI client does with `?token=${username}`.
        socket = new WebSocket(`ws://localhost:3000/?token=${username}`);

        // Disable Connect while a connection is open/opening, so a second
        // click can't spin up a duplicate socket under the same tab.
        connectBtn.disabled = true;
        usernameInput.disabled = true;

        socket.onopen = () => {
            log('connected');
            joinBtn.disabled = false;
        };

        socket.onmessage = (event) => {
            let data;
            try {
                // Mirrors index.js's own try/catch around JSON.parse (index.js:66-75) -
                // the server sends JSON strings by convention, not by protocol guarantee,
                // so a malformed payload is a real (if unlikely) possibility here too.
                data = JSON.parse(event.data);
            } catch (err) {
                log(`received non-JSON message: ${event.data}`);
                return;
            }

            if (data.type === 'user-joined') {
                log(`user-joined: ${data.username}`);
            } else if (data.type === 'user-left') {
                log(`user-left: ${data.username}`);
            } else {
                log(`received: ${JSON.stringify(data)}`);
            }
        };

        socket.onclose = (event) => {
            // Matches server/test-client.js's close handler shape:
            // it logs code and reason.toString() - event.reason here
            // is already a string, so no .toString() call is needed.
            log(`disconnected: code=${event.code} reason=${event.reason || '(none)'}`);
            connectBtn.disabled = false;
            usernameInput.disabled = false;
            joinBtn.disabled = true;
            socket = null;
        };

        socket.onerror = () => {
            // Raw WebSocket error events carry no useful detail (no message,
            // no code) - this is a real limitation of the browser API, not
            // something we're choosing to skip logging.
            log('connection error');
        };
    });

    joinBtn.addEventListener('click', () => {
        const roomId = roomIdInput.value.trim();
        if (!roomId) {
            log('enter a room id first');
            return;
        }
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            log('not connected');
            return;
        }

        socket.send(JSON.stringify({ type: 'join-room', roomId }));
        log(`sent join-room: ${roomId}`);
    });
</script>

</body>
</html>
